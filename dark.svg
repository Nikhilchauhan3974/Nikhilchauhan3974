<title id="title">Nikhil Chauhan — BTech CSE Student and Full-Stack Developer</title>
<desc id="desc">Animated developer profile for Nikhil Chauhan at KL University, showing a character portrait generated from his supplied photograph, technical stack, projects and contact links.</desc>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
  .small{font-size:12px;letter-spacing:1.4px}
  .label{font-size:13px;letter-spacing:2px}
  .portrait-line{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:8px;fill:#d7f9ff;white-space:pre;opacity:0;animation:none}
  .reveal{opacity:0}
  @media (prefers-reduced-motion: reduce) { .reveal,.portrait-line{opacity:1} }
</style>

<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="52%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#10b981"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="0.12 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;2;1" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".055"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="portraitClip"><rect x="40" y="132" width="430" height="365" rx="22"/></clipPath>
</defs>

