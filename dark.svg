<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nikhil Chauhan Developer Profile">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#07111F" />
    </linearGradient>
    
    <!-- Panel Gradients -->
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .terminal-text { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #94A3B8; }
    .terminal-highlight { fill: #22D3EE; font-weight: bold; }
    .ascii-art { font-family: monospace; font-size: 12px; fill: #10B981; font-weight: bold; letter-spacing: 2px; }
    .heading { font-family: system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 800; fill: #F8FAFC; }
    .subheading { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #6366F1; }
    .label { font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; fill: #9333EA; }
    .value { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; fill: #F8FAFC; font-weight: 500; }
    .pill-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #F8FAFC; }
    .pill-bg { fill: #1E293B; stroke: #334155; stroke-width: 1; rx: 16; }
  </style>

  <!-- Canvas Background -->
  <rect width="1180" height="610" rx="24" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" />

  <!-- ================= LEFT PANEL (Terminal) ================= -->
  <g transform="translate(24, 24)">
    <rect width="440" height="562" rx="16" fill="url(#panel-grad)" stroke="#1E293B" stroke-width="2" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="6" fill="#EF4444" />
    <circle cx="44" cy="24" r="6" fill="#F59E0B" />
    <circle cx="64" cy="24" r="6" fill="#10B981" />
    
    <text x="88" y="28" class="terminal-text">nikhilchauhan@dev-terminal:~</text>
    <text x="24" y="65" class="terminal-text">$&gt; <tspan class="terminal-highlight">init --profile --system-check</tspan></text>
    <text x="24" y="90" class="terminal-text" fill="#10B981">System nominal. Rendering identity matrix...</text>
    
    <!-- ASCII Art (Abstract Developer Node / N) -->
    <g transform="translate(50, 140)">
      <text y="0" class="ascii-art">      :::::::.      .::::::      </text>
      <text y="20" class="ascii-art">      ::::::::.    .:::::::      </text>
      <text y="40" class="ascii-art">      :::::::::.  .::::::::      </text>
      <text y="60" class="ascii-art">      :::  ::::::.::::  :::      </text>
      <text y="80" class="ascii-art">      :::   ::::::::::  :::      </text>
      <text y="100" class="ascii-art">      :::    ::::::::   :::      </text>
      <text y="120" class="ascii-art">      :::     ::::::    :::      </text>
      <text y="140" class="ascii-art">      :::      ::::     :::      </text>
      <text y="160" class="ascii-art">      :::       ::      :::      </text>
      <text y="180" class="ascii-art">      :::               :::      </text>
      <text y="200" class="ascii-art">      :::               :::      </text>
      <text y="220" class="ascii-art">      ...               ...      </text>
      <text y="260" x="-10" class="terminal-text" fill="#6366F1">Identity: NIKHIL_CHAUHAN [VERIFIED]</text>
      <text y="285" x="-10" class="terminal-text">Status: Active Developer</text>
      <text y="310" x="-10" class="terminal-text">Uptime: 24/7/365</text>
    </g>

    <!-- Scanline Animation -->
    <rect x="2" y="45" width="436" height="4" fill="url(#scanline-grad)">
      <animate attributeName="y" values="45; 550; 45" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ================= RIGHT PANEL (SYSTEM.INFO) ================= -->
  <g transform="translate(488, 24)">
    <rect width="668" height="562" rx="16" fill="url(#panel-grad)" stroke="#1E293B" stroke-width="2" />
    
    <!-- Header -->
    <text x="40" y="60" class="subheading">SYSTEM.INFO // 127.0.0.1</text>
    <text x="40" y="110" class="heading">Nikhil Chauhan</text>
    
    <!-- Animated Role Block -->
    <g transform="translate(40, 150)">
      <text x="0" y="0" class="value" fill="#22D3EE" font-size="22px" font-weight="700">
        <tspan opacity="0">Full-Stack Developer<animate attributeName="opacity" values="1;0;0;0;1" dur="10s" repeatCount="indefinite" /></tspan>
        <tspan dx="-210" opacity="0">AI/ML Enthusiast<animate attributeName="opacity" values="0;1;0;0;0" dur="10s" repeatCount="indefinite" /></tspan>
        <tspan dx="-170" opacity="0">Backend Engineer<animate attributeName="opacity" values="0;0;1;0;0" dur="10s" repeatCount="indefinite" /></tspan>
        <tspan dx="-170" opacity="0">Problem Solver<animate attributeName="opacity" values="0;0;0;1;0" dur="10s" repeatCount="indefinite" /></tspan>
      </text>
    </g>
    
    <!-- Line separator -->
    <line x1="40" y1="180" x2="628" y2="180" stroke="#1E293B" stroke-width="2" />

    <!-- Info Grid -->
    <g transform="translate(40, 220)">
      <text x="0" y="0" class="label">University:</text>
      <text x="0" y="25" class="value">KL University, Vijayawada, AP</text>

      <text x="0" y="70" class="label">Degree:</text>
      <text x="0" y="95" class="value">BTech Computer Science Engineering</text>

      <text x="320" y="0" class="label">Core Focus:</text>
      <text x="320" y="25" class="value">Software Engineering</text>
      <text x="320" y="50" class="value">DSA &amp; System Design</text>
      <text x="320" y="75" class="value">Backend Architecture</text>
    </g>

    <!-- Line separator -->
    <line x1="40" y1="340" x2="628" y2="340" stroke="#1E293B" stroke-width="2" />

    <!-- Tech Stack Matrix Pills -->
    <text x="40" y="380" class="subheading" fill="#94A3B8">CAPABILITY_MATRIX</text>
    
    <g transform="translate(40, 410)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="130" height="36" class="pill-bg" />
      <text x="65" y="23" text-anchor="middle" class="pill-text">Full-Stack</text>

      <rect x="142" y="0" width="110" height="36" class="pill-bg" />
      <text x="197" y="23" text-anchor="middle" class="pill-text">AI/ML</text>

      <rect x="264" y="0" width="90" height="36" class="pill-bg" />
      <text x="309" y="23" text-anchor="middle" class="pill-text">DSA</text>

      <!-- Row 2 -->
      <rect x="0" y="52" width="160" height="36" class="pill-bg" />
      <text x="80" y="75" text-anchor="middle" class="pill-text">Backend Dev</text>

      <rect x="172" y="52" width="160" height="36" class="pill-bg" />
      <text x="252" y="75" text-anchor="middle" class="pill-text">System Design</text>

      <rect x="344" y="52" width="140" height="36" class="pill-bg" />
      <text x="414" y="75" text-anchor="middle" class="pill-text">Open Source</text>
    </g>

  </g>
</svg>
