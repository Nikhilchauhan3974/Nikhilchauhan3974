<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Professional GitHub profile banner for Nikhilchauhan3974 with terminal-style identity and system information in light theme">
  <defs>
    <linearGradient id="bgGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF6FF"/>
      <animate attributeName="x2" values="1;0.85;1" dur="16s" repeatCount="indefinite"/>
